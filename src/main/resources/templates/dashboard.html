<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        #profileMenuContainer {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        #profileButton {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        #profileButton:hover {
            background-color: #1976D2;
        }

        #profileMenu {
            display: none;
            position: absolute;
            top: 45px;
            right: 0;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-width: 150px;
            z-index: 999;
        }

        #profileMenu a {
            display: block;
            padding: 10px 15px;
            color: #333;
            text-decoration: none;
        }

        #profileMenu a:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
<div id="profileMenuContainer">
    <button id="profileButton" th:text="'Профиль ⯆'"></button>
    <div id="profileMenu">
        <form th:action="@{/logout}" method="post">
            <button type="submit" style="width: 100%; text-align: left; padding: 10px; border: none; background: #f44336; cursor: pointer;">
                Выйти
            </button>
        </form>
    </div>
</div>

<h1>Мои задачи</h1>

<div>
    <button onclick="showAllTasks()">Все</button>
    <button onclick="filterTasks(true)">Выполненные</button>
    <button onclick="filterTasks(false)">Невыполненные</button>
    <input type="text" id="searchInput" placeholder="Поиск..." oninput="searchTasks()" />
    <button onclick="location.href='/task-form'">Добавить задачу</button>
</div>

<div id="progressContainer">
    <label>Прогресс:</label>
    <progress id="progressBar" value="0" max="100"></progress>
    <span id="progressText">0%</span>
</div>

<ul id="taskList"></ul>

<div class="task-list">
    <div th:each="task : ${tasks}" class="task-card">
        <h3 th:text="${task.title}">Заголовок задачи</h3>
        <p th:text="${task.description}">Описание задачи</p>
        <p th:text="'Приоритет: ' + ${task.priority}"></p>
        <p th:text="'Статус: ' + ${task.status}"></p>
        <a th:href="@{/task-form(id=${task.id})}">Редактировать</a>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const tasks = document.querySelectorAll(".task-card");
        const total = tasks.length;
        const completed = Array.from(tasks).filter(task =>
            task.textContent.includes("Статус: FINISHED")
        ).length;

        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

        document.getElementById("progressBar").value = percent;
        document.getElementById("progressText").textContent = percent + "%";
    });
</script>

<script>
    function filterTasks(completed) {
        const tasks = document.querySelectorAll(".task-card");
        tasks.forEach(task => {
            const status = task.textContent.includes("FINISHED");
            if (completed && status || !completed && !status) {
                task.style.display = "";
            } else {
                task.style.display = "none";
            }
        });
    }

    function showAllTasks() {
        document.querySelectorAll(".task-card").forEach(task => {
            task.style.display = "";
        });
    }

    function searchTasks() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        document.querySelectorAll(".task-card").forEach(task => {
            const text = task.textContent.toLowerCase();
            task.style.display = text.includes(query) ? "" : "none";
        });
    }
</script>
</body>
</html>
