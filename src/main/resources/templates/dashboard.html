<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        #profileMenuContainer {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        #profileButton {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        #profileButton:hover {
            background-color: #1976D2;
        }

        #profileMenu {
            display: none;
            position: absolute;
            top: 45px;
            right: 0;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-width: 150px;
            z-index: 999;
        }

        #profileMenu a, #profileMenu form button {
            display: block;
            padding: 10px 15px;
            color: #333;
            text-decoration: none;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        #profileMenu a:hover,
        #profileMenu form button:hover {
            background-color: #f0f0f0;
        }

        .complete-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 10px;
        }

        .complete-button:hover {
            background-color: #388E3C;
        }
    </style>
</head>
<body>
<div id="profileMenuContainer">
    <button id="profileButton">Профиль ⯆</button>
    <div id="profileMenu">
        <form th:action="@{/logout}" method="post">
            <button type="submit" style="background: #f44336; color: white;">Выйти</button>
        </form>
    </div>
</div>

<h1 style="text-align: center;">Мои задачи</h1>

<div style="text-align: center; margin-bottom: 20px;">
    <button onclick="showAllTasks()">Все</button>
    <button onclick="filterTasks(true)">Выполненные</button>
    <button onclick="filterTasks(false)">Невыполненные</button>
    <input type="text" id="searchInput" placeholder="Поиск..." oninput="searchTasks()"/>
    <button onclick="location.href='/task-form'">Добавить задачу</button>
    <button onclick="location.href='/report'" style="background-color: #4CAF50; color: white; margin-left: 10px;">
        Отчёт
    </button>
</div>

<div id="progressContainer" style="text-align: center; margin-bottom: 20px;">
    <label>Прогресс:</label>
    <progress id="progressBar" value="0" max="100"></progress>
    <span id="progressText">0%</span>
</div>

<!-- Админ-панель -->
<div sec:authorize="hasRole('ADMIN')" style="text-align: center; margin-top: 30px;">
    <h2>Админ-панель</h2>
    <button onclick="location.href='/admin/users'" style="margin: 5px;">Пользователи</button>
    <button onclick="location.href='/admin/tasks'" style="margin: 5px;">Все задачи</button>
</div>

<!-- Список задач -->
<div th:each="task : ${tasks}" class="task-card">
    <h3 th:text="${task.title}">Заголовок задачи</h3>
    <p th:text="${task.description}">Описание задачи</p>
    <p th:text="'Приоритет: ' + ${task.priority}"></p>
    <p th:text="'Дедлайн: ' + ${task.deadline()}"></p>
    <p th:text="'Статус: ' + ${task.status}"></p>
    <a th:href="@{/task-form(id=${task.id})}" class="edit-link">Редактировать</a>
    <button class="delete-button" th:attr="data-id=${task.id}" onclick="confirmDelete(this)">Удалить</button>
    <button class="complete-button"
            th:if="${task.status.name() == 'OPENED'}"
            th:attr="data-task-id=${task.id}"
            onclick="completeTask(this)">
        Завершить
    </button>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const tasks = document.querySelectorAll(".task-card");
        const total = tasks.length;
        const completed = Array.from(tasks).filter(task =>
            task.textContent.includes("Статус: FINISHED")
        ).length;

        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

        document.getElementById("progressBar").value = percent;
        document.getElementById("progressText").textContent = percent + "%";
    });

    document.getElementById("profileButton").addEventListener("click", function () {
        const menu = document.getElementById("profileMenu");
        menu.style.display = menu.style.display === "block" ? "none" : "block";
    });

    document.addEventListener("click", function (event) {
        const menu = document.getElementById("profileMenu");
        const button = document.getElementById("profileButton");
        if (!menu.contains(event.target) && !button.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    function filterTasks(completed) {
        const tasks = document.querySelectorAll(".task-card");
        tasks.forEach(task => {
            const status = task.textContent.includes("FINISHED");
            task.style.display = (completed && status) || (!completed && !status) ? "" : "none";
        });
    }

    function showAllTasks() {
        document.querySelectorAll(".task-card").forEach(task => {
            task.style.display = "";
        });
    }

    function searchTasks() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        document.querySelectorAll(".task-card").forEach(task => {
            const title = task.querySelector("h3")?.textContent.toLowerCase() || "";
            task.style.display = title.includes(query) ? "" : "none";
        });
    }

    function confirmDelete(button) {
        const taskId = button.getAttribute('data-id');
        if (!confirm('Вы уверены, что хотите удалить задачу?')) return;

        fetch('/delete-task', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: taskId})
        })
            .then(response => response.ok ? window.location.reload() : alert('Ошибка при удалении задачи.'));
    }

    function completeTask(button) {
        const taskId = button.getAttribute("data-task-id");

        fetch('/complete-task', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams({id: taskId})
        }).then(response => {
            if (response.redirected) {
                window.location.href = response.url;
            } else if (response.ok) {
                // Мягкое обновление без перезагрузки, если нужно
                location.reload();
            } else {
                alert('Не удалось завершить задачу');
            }
        }).catch(() => alert('Ошибка запроса'));
    }
</script>
</body>
</html>
