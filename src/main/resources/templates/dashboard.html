<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/templates/css/styles.css">
    <style>
        #profileMenuContainer {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        #profileButton {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        #profileButton:hover {
            background-color: #1976D2;
        }

        #profileMenu {
            display: none;
            position: absolute;
            top: 45px;
            right: 0;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-width: 150px;
            z-index: 999;
        }

        #profileMenu a {
            display: block;
            padding: 10px 15px;
            color: #333;
            text-decoration: none;
        }

        #profileMenu a:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
<div id="profileMenuContainer">
    <button id="profileButton">Профиль ⯆</button>
    <div id="profileMenu">
        <a href="#" onclick="logout()">Выйти</a>
    </div>
</div>

<h1>Мои задачи</h1>

<div>
    <button onclick="showAllTasks()">Все</button>
    <button onclick="filterTasks(true)">Выполненные</button>
    <button onclick="filterTasks(false)">Невыполненные</button>
    <input type="text" id="searchInput" placeholder="Поиск..." oninput="searchTasks()" />
    <button onclick="location.href='/add-task.html'">Добавить задачу</button>
</div>

<div id="progressContainer">
    <label>Прогресс:</label>
    <progress id="progressBar" value="0" max="100"></progress>
    <span id="progressText">0%</span>
</div>

<ul id="taskList"></ul>

<script>
    let tasks = [];

    async function fetchTasks() {
        const response = await fetch('/api/tasks');
        tasks = await response.json();
        renderTasks(tasks);
        updateProgress();
    }

    function renderTasks(taskArray) {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        taskArray.forEach(task => {
            const li = document.createElement('li');
            li.innerHTML = `
                <strong>${task.title}</strong> — ${task.completed ? '✅' : '❌'}
                <button onclick="editTask(${task.id})">Редактировать</button>
                <button onclick="deleteTask(${task.id})">Удалить</button>
            `;
            list.appendChild(li);
        });
    }

    function showAllTasks() {
        renderTasks(tasks);
    }

    function filterTasks(completed) {
        const filtered = tasks.filter(t => t.completed === completed);
        renderTasks(filtered);
    }

    function searchTasks() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = tasks.filter(t => t.title.toLowerCase().includes(query));
        renderTasks(filtered);
    }

    async function deleteTask(id) {
        await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
        await fetchTasks();
    }

    function editTask(id) {
        location.href = `/edit-task.html?id=${id}`;
    }

    function updateProgress() {
        const done = tasks.filter(t => t.completed).length;
        const percent = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
        document.getElementById('progressBar').value = percent;
        document.getElementById('progressText').innerText = percent + '%';
    }

    function logout() {
        fetch('/logout', { method: 'POST' })
            .then(() => {
                window.location.href = '/login.html';
            });
    }

    document.getElementById('profileButton').addEventListener('click', function () {
        const menu = document.getElementById('profileMenu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });

    window.addEventListener('click', function(e) {
        const profileButton = document.getElementById('profileButton');
        const menu = document.getElementById('profileMenu');
        if (!profileButton.contains(e.target) && !menu.contains(e.target)) {
            menu.style.display = 'none';
        }
    });

    fetchTasks();
</script>
</body>
</html>
