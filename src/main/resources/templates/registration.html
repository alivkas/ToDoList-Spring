<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<h2>Регистрация</h2>

<!-- Форма с биндингом к userDto -->
<form th:action="@{/registration}" method="post" th:object="${userDto}">
    <label for="username">Имя пользователя:</label><br>
    <input type="text" id="username" th:field="*{username}" required><br>
    <div style="color:red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Ошибка</div><br>

    <label for="password">Пароль:</label><br>
    <input type="password" id="password" th:field="*{password}" required><br>
    <div style="color:red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Ошибка</div><br>

    <label for="passwordCheck">Повторите пароль:</label><br>
    <input type="password" id="passwordCheck" th:field="*{passwordCheck}" required><br>
    <div style="color:red" th:if="${#fields.hasErrors('passwordCheck')}" th:errors="*{passwordCheck}">Ошибка</div><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" th:field="*{email}" required><br>
    <div style="color:red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Ошибка</div><br>

    <button type="submit">Зарегистрироваться</button>
</form>

<!-- Общее сообщение об ошибке -->
<p th:if="${errorMessage}" style="color: red;" th:text="${errorMessage}"></p>

<!-- Ссылка на вход -->
<div style="text-align: center; margin-top: 20px;">
    <span>Уже есть аккаунт?</span>
    <button onclick="window.location.href='/login'">Войти</button>
</div>

</body>
</html>
