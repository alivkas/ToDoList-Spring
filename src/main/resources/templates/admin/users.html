<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Админ – Пользователи</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div id="profileMenuContainer">
    <button id="profileButton">Профиль ⯆</button>
    <div id="profileMenu">
        <form th:action="@{/logout}" method="post">
            <button type="submit" style="width: 100%; text-align: left; padding: 10px; border: none; background: #f44336;">
                Выйти
            </button>
        </form>
    </div>
</div>

<h1>Пользователи системы</h1>

<div class="task-list" style="max-width: 800px; margin: 0 auto;">
    <div th:each="user : ${users}" class="task-card">
        <h3 th:text="${user.username}">Имя пользователя</h3>
        <p th:text="'Email: ' + ${user.email}">email</p>
        <p th:text="'Роли: ' + ${user.roles}">Роли</p>
        <form th:action="@{/admin/delete-user}" method="post" style="margin-top: 10px;">
            <input type="hidden" name="username" th:value="${user.username}" />
            <button class="delete-button" type="submit">Удалить</button>
        </form>
    </div>
</div>

<script>
    document.getElementById("profileButton").addEventListener("click", function () {
        const menu = document.getElementById("profileMenu");
        menu.style.display = menu.style.display === "block" ? "none" : "block";
    });

    document.addEventListener("click", function (event) {
        const menu = document.getElementById("profileMenu");
        const button = document.getElementById("profileButton");
        if (!menu.contains(event.target) && !button.contains(event.target)) {
            menu.style.display = "none";
        }
    });
</script>

</body>
</html>
