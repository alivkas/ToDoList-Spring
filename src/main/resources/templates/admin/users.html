<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Админ – Пользователи</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .delete-button {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .delete-button:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

<div id="profileMenuContainer">
    <button onclick="location.href='/dashboard'" style="
        background-color: #2196F3;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        margin-right: 10px;
    ">
        На главную
    </button>
</div>

<h1 style="text-align: center;">Пользователи системы</h1>

<div class="task-list" style="max-width: 800px; margin: 0 auto;">
    <div th:each="user : ${users}" class="task-card">
        <h3 th:text="${user.username}">Имя пользователя</h3>
        <p th:text="'Email: ' + ${user.email}">email</p>

        <button class="delete-button"
                th:attr="data-username=${user.username}"
                onclick="confirmDeleteUser(this)">
            Удалить
        </button>
    </div>
</div>

<script>
    function confirmDeleteUser(button) {
        const username = button.getAttribute("data-username");
        if (!confirm(`Удалить пользователя "${username}"?`)) return;

        fetch("/admin/delete-user", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: "username=" + encodeURIComponent(username)
        })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert("Ошибка при удалении пользователя.");
                }
            });
    }
</script>

</body>
</html>
