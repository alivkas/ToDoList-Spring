<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Админ – Задачи</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .delete-button {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .delete-button:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

<div id="profileMenuContainer">
    <button onclick="location.href='/dashboard'" style="
        background-color: #2196F3;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        margin-right: 10px;
    ">
        На главную
    </button>
</div>

<h1 style="text-align: center;">Все задачи в системе</h1>

<div class="task-list" style="max-width: 800px; margin: 0 auto;">
    <div th:each="task : ${tasks}" class="task-card">
        <h3 th:text="${task.title}">Заголовок</h3>
        <p th:text="${task.description}">Описание</p>
        <p th:text="'Приоритет: ' + ${task.priority}">Приоритет</p>
        <p th:text="'Дедлайн: ' + ${task.deadline()}">Дедлайн</p>
        <button class="delete-button"
                th:attr="data-id=${task.id}"
                onclick="deleteTask(this)">
            Удалить
        </button>
    </div>
</div>

<script>
    document.getElementById("profileButton").addEventListener("click", function () {
        const menu = document.getElementById("profileMenu");
        menu.style.display = menu.style.display === "block" ? "none" : "block";
    });

    document.addEventListener("click", function (event) {
        const menu = document.getElementById("profileMenu");
        const button = document.getElementById("profileButton");
        if (!menu.contains(event.target) && !button.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    function deleteTask(button) {
        const taskId = button.getAttribute('data-id');
        if (!confirm('Удалить задачу?')) return;

        const formData = new URLSearchParams();
        formData.append("taskId", taskId);

        fetch('/admin/delete-task', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: formData.toString()
        }).then(response => {
            if (response.ok) {
                window.location.reload();
            } else {
                alert('Ошибка при удалении задачи.');
            }
        });
    }
</script>

</body>
</html>
